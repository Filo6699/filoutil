repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: local
    hooks:
      - id: stage-formatted-files
        name: Stage files modified by formatters
        entry: bash -c 'git diff --cached --name-only --diff-filter=ACM 2>/dev/null | xargs -r -I {} git add {} 2>/dev/null || true; exit 0'
        language: system
        pass_filenames: false
        always_run: true
